services:
  postgres:
    image: postgres:16
    container_name: lyricmotion-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lyricmotion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lyricmotion-web
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/lyricmotion
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - .:/app:cached
    command: ["npm", "run", "start"]

volumes:
  postgres_data:
